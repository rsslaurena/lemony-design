# Publie la maquette du site Maison Lemony sur GitHub Pages à chaque push sur main
name: Publier la maquette

on:
  push:
    branches: [main]
    paths:
      - 'Projet Cave A CIgare site web/maquette/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site (sans les scripts de génération)
        run: |
          mkdir _site
          rsync -a --exclude '_src' --exclude 'LISEZMOI.md' "Projet Cave A CIgare site web/maquette/" _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
